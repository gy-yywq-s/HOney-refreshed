    <path d="M445 116C479 148 495 189 495 230C495 271 480 310 448 341" stroke="#A7B3AA" stroke-width="15"/>

    <!-- n is the bridge between two distinct counters -->
    <path d="M538 382V218C538 174 566 148 607 148C650 148 677 176 677 220V382" stroke="#293237" stroke-width="25"/>
    <path d="M677 267H716" stroke="#6B786D" stroke-width="14"/>

    <!-- e is a second, smaller place with a carried counter -->
