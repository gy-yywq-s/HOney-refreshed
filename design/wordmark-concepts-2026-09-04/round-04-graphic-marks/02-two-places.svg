<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#F1F5F3"/>
  <text x="70" y="65" font-family="Source Sans 3, Helvetica Neue, sans-serif" font-size="19" fill="#66736C">Two places</text>
  <g transform="translate(146 186)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- H gate -->
    <path d="M42 78V382M194 78V382M42 230H194" stroke="#293237" stroke-width="25"/>
    <path d="M101 230C111 217 125 217 136 230" stroke="#6B786D" stroke-width="14"/>

    <!-- O first place, intentionally complete -->
