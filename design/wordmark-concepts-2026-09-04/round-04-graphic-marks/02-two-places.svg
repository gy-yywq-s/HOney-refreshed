    <ellipse cx="766" cy="267" rx="18" ry="13" stroke="#6B786D" stroke-width="8"/>

    <!-- y exit -->
    <path d="M907 158L975 382L1052 158M975 382C963 442 938 469 887 469" stroke="#293237" stroke-width="25"/>
    <path d="M948 450C966 443 973 431 978 413" stroke="#A7B3AA" stroke-width="14"/>
