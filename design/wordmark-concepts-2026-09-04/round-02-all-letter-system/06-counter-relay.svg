  <path d="M250 409C358 363 405 456 507 417C591 385 628 449 721 420C805 394 849 448 936 420C1022 392 1074 428 1142 471" fill="none" stroke="#7657D6" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>
  <text x="100" y="735" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#646472">The dots are not route markers; they are a moving counter shared by the alphabet.</text>
</svg>
