  <text x="92" y="82" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#5C5C68">06  Counter relay</text>
  <text x="92" y="124" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#848491">The negative spaces pass a small inner shape from letter to letter; the graphic lives inside the reading.</text>

