    <path d="M868 137L938 325L1014 137M938 325C926 374 903 397 858 397"/>
  </g>

  <!-- one small counter migrates through all five glyphs -->
  <g fill="#7657D6">
    <rect x="236" y="395" width="28" height="28" rx="9" transform="rotate(45 250 409)"/>
    <circle cx="507" cy="417" r="17"/>
