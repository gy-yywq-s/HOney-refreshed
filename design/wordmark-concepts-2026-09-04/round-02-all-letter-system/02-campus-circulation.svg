  <g transform="translate(116 703)" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif">
    <text x="0" y="0" font-size="18" fill="#59635F">Gate → courtyard → covered connection → turn → fork</text>
    <text x="0" y="36" font-size="16" fill="#818B87">The campus meaning is carried by the sequence, not by an icon hidden in O.</text>
