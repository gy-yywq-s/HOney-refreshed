  <text x="92" y="82" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#58625E">02  Campus circulation</text>
  <text x="92" y="124" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#7F8985">One route changes function as it passes through every letter; it cannot be detached from the name.</text>

