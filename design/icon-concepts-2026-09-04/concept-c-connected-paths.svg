<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#101820" flood-opacity=".14"/></filter>
    <g id="mark-c">
      <path d="M225 500C300 321 466 320 559 497C649 670 793 675 835 520" fill="none" stroke="currentColor" stroke-width="60" stroke-linecap="round"/>
      <path d="M225 566C318 724 481 704 569 534C654 370 790 352 835 500" fill="none" stroke="var(--accent)" stroke-width="48" stroke-linecap="round"/>
      <circle cx="225" cy="532" r="22" fill="var(--accent)"/>
      <circle cx="835" cy="510" r="22" fill="currentColor"/>
    </g>
    <g id="web-badge"><circle cx="790" cy="790" r="112" fill="var(--surface)" stroke="var(--surface)" stroke-width="30"/><circle cx="790" cy="790" r="78" fill="none" stroke="var(--ink)" stroke-width="20"/><ellipse cx="790" cy="790" rx="37" ry="78" fill="none" stroke="var(--ink)" stroke-width="15"/><path d="M716 790H864" fill="none" stroke="var(--ink)" stroke-width="15" stroke-linecap="round"/></g>
    <symbol id="light-c" viewBox="0 0 1024 1024" style="--surface:#F3F0FA;--ink:#25354A;--accent:#5E9ED6;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-c"/></symbol>
    <symbol id="dark-c" viewBox="0 0 1024 1024" style="--surface:#15191D;--ink:#F0EEE8;--accent:#89A194;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-c"/></symbol>
    <symbol id="tint-c" viewBox="0 0 1024 1024" style="--surface:#DDE1E5;--ink:#101820;--accent:#101820;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-c"/></symbol>
    <symbol id="web-c" viewBox="0 0 1024 1024" style="--surface:#F3F0FA;--ink:#25354A;--accent:#5E9ED6;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><g transform="translate(-28 -28) scale(.96)"><use xlink:href="#mark-c"/></g><use xlink:href="#web-badge"/></symbol>
  </defs>
  <rect width="1440" height="920" fill="#E9ECEF"/>
  <text x="72" y="80" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#182532">C · Connected paths</text>
  <text x="72" y="122" font-family="Arial, sans-serif" font-size="22" fill="#66717B">Two springy paths cross: classes and people, without a serious “network platform” look.</text>
  <use xlink:href="#light-c" x="76" y="190" width="500" height="500" filter="url(#shadow)"/><text x="76" y="732" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">iOS · soft lilac / navy / blue</text>
  <use xlink:href="#dark-c" x="626" y="205" width="220" height="220" filter="url(#shadow)"/><text x="626" y="455" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Dark</text>
  <use xlink:href="#tint-c" x="626" y="492" width="220" height="220" filter="url(#shadow)"/><text x="626" y="742" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Tinted</text>
  <use xlink:href="#web-c" x="942" y="230" width="390" height="390" filter="url(#shadow)"/><text x="942" y="662" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">Web companion · neutral globe, not another accent block</text>
  <use xlink:href="#light-c" x="960" y="730" width="64" height="64"/><use xlink:href="#web-c" x="1048" y="730" width="64" height="64"/><text x="1130" y="771" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">64 px check</text>
  <rect x="72" y="846" width="1296" height="1" fill="#C8CED4"/><text x="72" y="882" font-family="-apple-system,sans-serif" font-size="17" fill="#76818B">Most social option · soft movement rather than institutional symbolism</text>
</svg>
