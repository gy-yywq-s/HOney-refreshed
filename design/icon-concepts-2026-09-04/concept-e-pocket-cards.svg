<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#101820" flood-opacity=".14"/></filter>
    <g id="mark-e">
      <rect x="270" y="270" width="512" height="430" rx="92" fill="none" stroke="currentColor" stroke-width="58" transform="rotate(-5 526 485)"/>
      <rect x="240" y="326" width="512" height="430" rx="92" fill="var(--surface)" stroke="currentColor" stroke-width="58" transform="rotate(4 496 541)"/>
      <circle cx="370" cy="467" r="32" fill="var(--accent)"/>
      <path d="M444 460H648M350 570H650M350 650H555" fill="none" stroke="currentColor" stroke-width="43" stroke-linecap="round"/>
    </g>
    <g id="web-badge"><circle cx="790" cy="790" r="112" fill="var(--surface)" stroke="var(--surface)" stroke-width="30"/><circle cx="790" cy="790" r="78" fill="none" stroke="var(--ink)" stroke-width="20"/><ellipse cx="790" cy="790" rx="37" ry="78" fill="none" stroke="var(--ink)" stroke-width="15"/><path d="M716 790H864" fill="none" stroke="var(--ink)" stroke-width="15" stroke-linecap="round"/></g>
    <symbol id="light-e" viewBox="0 0 1024 1024" style="--surface:#FFF2D9;--ink:#26394A;--accent:#F18B68;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-e"/></symbol>
    <symbol id="dark-e" viewBox="0 0 1024 1024" style="--surface:#171B20;--ink:#F3EEE4;--accent:#F29A79;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-e"/></symbol>
    <symbol id="tint-e" viewBox="0 0 1024 1024" style="--surface:#DDE1E5;--ink:#101820;--accent:#101820;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-e"/></symbol>
    <symbol id="web-e" viewBox="0 0 1024 1024" style="--surface:#FFF2D9;--ink:#26394A;--accent:#F18B68;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><g transform="translate(-26 -26) scale(.96)"><use xlink:href="#mark-e"/></g><use xlink:href="#web-badge"/></symbol>
  </defs>
  <rect width="1440" height="920" fill="#E9ECEF"/>
  <text x="72" y="80" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#182532">E · Pocket cards</text>
  <text x="72" y="122" font-family="Arial, sans-serif" font-size="22" fill="#66717B">Two slightly wonky cards: timetable, permits and notes as one everyday pocket tool.</text>
  <use xlink:href="#light-e" x="76" y="190" width="500" height="500" filter="url(#shadow)"/><text x="76" y="732" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">iOS · butter / navy / coral</text>
  <use xlink:href="#dark-e" x="626" y="205" width="220" height="220" filter="url(#shadow)"/><text x="626" y="455" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Dark</text>
  <use xlink:href="#tint-e" x="626" y="492" width="220" height="220" filter="url(#shadow)"/><text x="626" y="742" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Tinted</text>
  <use xlink:href="#web-e" x="942" y="230" width="390" height="390" filter="url(#shadow)"/><text x="942" y="662" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">Web companion · globe replaces a conventional status badge</text>
  <use xlink:href="#light-e" x="960" y="730" width="64" height="64"/><use xlink:href="#web-e" x="1048" y="730" width="64" height="64"/><text x="1130" y="771" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">64 px check</text>
  <rect x="72" y="846" width="1296" height="1" fill="#C8CED4"/><text x="72" y="882" font-family="-apple-system,sans-serif" font-size="17" fill="#76818B">Most obviously useful · playful tilt without becoming a cartoon</text>
</svg>
