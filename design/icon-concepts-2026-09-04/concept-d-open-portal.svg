<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="920" viewBox="0 0 1440 920">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#101820" flood-opacity=".14"/></filter>
    <pattern id="paper" width="1024" height="1024" patternUnits="userSpaceOnUse"><image xlink:href="paper-texture-component.png" width="1024" height="1024" opacity=".05"/></pattern>
    <g id="mark-d">
      <path d="M284 720V486C284 318 410 228 566 228C722 228 828 330 828 486V690" fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round"/>
      <path d="M462 720V525C462 451 516 407 585 407C654 407 706 451 706 525V620" fill="none" stroke="var(--accent)" stroke-width="48" stroke-linecap="round"/>
      <circle cx="706" cy="674" r="28" fill="var(--accent)"/>
    </g>
    <g id="web-badge"><circle cx="790" cy="790" r="112" fill="var(--surface)" stroke="var(--surface)" stroke-width="30"/><circle cx="790" cy="790" r="78" fill="none" stroke="var(--ink)" stroke-width="20"/><ellipse cx="790" cy="790" rx="37" ry="78" fill="none" stroke="var(--ink)" stroke-width="15"/><path d="M716 790H864" fill="none" stroke="var(--ink)" stroke-width="15" stroke-linecap="round"/></g>
    <symbol id="light-d" viewBox="0 0 1024 1024" style="--surface:#EDF6EF;--ink:#24383B;--accent:#57A47A;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-d"/></symbol>
    <symbol id="dark-d" viewBox="0 0 1024 1024" style="--surface:#15191D;--ink:#F2EFE9;--accent:#88A7C8;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-d"/></symbol>
    <symbol id="tint-d" viewBox="0 0 1024 1024" style="--surface:#DDE1E5;--ink:#101820;--accent:#101820;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><use xlink:href="#mark-d"/></symbol>
    <symbol id="web-d" viewBox="0 0 1024 1024" style="--surface:#EDF6EF;--ink:#24383B;--accent:#57A47A;color:var(--ink)"><rect width="1024" height="1024" rx="224" fill="var(--surface)"/><g transform="translate(-28 -28) scale(.96)"><use xlink:href="#mark-d"/></g><use xlink:href="#web-badge"/></symbol>
  </defs>
  <rect width="1440" height="920" fill="#E9ECEF"/>
  <text x="72" y="80" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#182532">D · Open portal</text>
  <text x="72" y="122" font-family="Arial, sans-serif" font-size="22" fill="#66717B">A rounded open doorway with a little status dot: practical access, not school heraldry.</text>
  <use xlink:href="#light-d" x="76" y="190" width="500" height="500" filter="url(#shadow)"/><text x="76" y="732" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">iOS · pale mint / deep green-grey / green</text>
  <use xlink:href="#dark-d" x="626" y="205" width="220" height="220" filter="url(#shadow)"/><text x="626" y="455" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Dark</text>
  <use xlink:href="#tint-d" x="626" y="492" width="220" height="220" filter="url(#shadow)"/><text x="626" y="742" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">Tinted</text>
  <use xlink:href="#web-d" x="942" y="230" width="390" height="390" filter="url(#shadow)"/><text x="942" y="662" font-family="-apple-system,sans-serif" font-size="20" fill="#66717B">Web companion · globe sits beside the open threshold</text>
  <use xlink:href="#light-d" x="960" y="730" width="64" height="64"/><use xlink:href="#web-d" x="1048" y="730" width="64" height="64"/><text x="1130" y="771" font-family="-apple-system,sans-serif" font-size="18" fill="#66717B">64 px check</text>
  <rect x="72" y="846" width="1296" height="1" fill="#C8CED4"/><text x="72" y="882" font-family="-apple-system,sans-serif" font-size="17" fill="#76818B">Most access-led option · round corners keep it from feeling institutional</text>
</svg>
