  <path d="M150 620C220 770 420 760 512 512" fill="none" stroke="url(#left-return)" stroke-width="48" stroke-linecap="butt"/>
  <!-- small right loop returns to the lower opening -->
  <path d="M512 512C590 650 680 710 770 650C850 595 850 470 765 390" fill="none" stroke="url(#right-open)" stroke-width="48" stroke-linecap="butt"/>
  <!-- centre over/under: green passes over pale mist -->
  <path d="M512 512C548 459 587 412 630 382" fill="none" stroke="#EAF4F6" stroke-width="68" stroke-linecap="butt"/>
  <path d="M512 512C548 459 587 412 630 382" fill="none" stroke="#57A47A" stroke-width="48" stroke-linecap="butt"/>
  <circle cx="720" cy="350" r="24" fill="#745170"/>
  <circle cx="765" cy="390" r="24" fill="#F5AE54"/>
  <circle cx="748" cy="345" r="22" fill="#F5AE54"/>
  <path d="M794 310L823 277" fill="none" stroke="#57A47A" stroke-width="22" stroke-linecap="round"/>
</svg>
