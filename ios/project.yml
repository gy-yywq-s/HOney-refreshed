name: HOney
options:
  bundleIdPrefix: com.gaelisus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  HOney:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HOney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey
        PRODUCT_NAME: HOney
        # Automatic signing, no team baked in — Xcode uses your own Apple ID.
        # A free personal Apple ID is enough to run on your own iPhone.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: HOney
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"

  HOneyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HOneyTests
    dependencies:
      - target: HOney
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

  # Standalone prototype (docs/architecture/credential-image-sanitation.md):
  # its own app, its own tests, shares nothing with HOney but the repo.
  SanitationLab:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SanitationLab
        excludes:
          - "Fixtures/**"
          - "HANDOFF.md"
      - path: SanitationLab/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey.sanitationlab
        PRODUCT_NAME: SanitationLab
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Sanitation Lab
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_EMIT_LOC_STRINGS: "YES"

  SanitationLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SanitationLabTests
    dependencies:
      - target: SanitationLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey.sanitationlab.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  SanitationLab:
    build:
      targets:
        SanitationLab: all
        SanitationLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SanitationLabTests

  HOney:
    build:
      targets:
        HOney: all
        HOneyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HOneyTests
