# HOneyNative — the clean-room iPhone port (spec: HOney current Web → iPhone
# native port v1.0, 2026-09-02). Regenerate the project with `xcodegen
# generate` in this directory; the .xcodeproj is not committed. The old
# `ios/` target is NOT a source and NOT a dependency (scripts/check-no-reuse.sh).
name: HOneyNative
options:
  bundleIdPrefix: com.gaelisus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  HOneyCore:
    path: HOneyCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    # Servers per configuration; override HONEY_BASE_URL in a scheme or
    # xcconfig to point a Debug build at a review server.
    HONEY_BASE_URL: https://honey.gaelisus.com
    HONEY_PORTAL_BASE_URL: https://www.huayaopudong.com
    HONEY_ENVIRONMENT: production

targets:
  HOneyNative:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HOneyNative
        excludes:
          - "Resources/Fonts/**"
      # Source Sans 3 (variable, OFL) — the Web's one typeface, bundled.
      - path: HOneyNative/Resources/Fonts
        buildPhase: resources
        excludes:
          - "*.md"
    dependencies:
      - package: HOneyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey.native
        PRODUCT_NAME: HOneyNative
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: HOney
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "NO"
    configs:
      Debug:
        HONEY_ENVIRONMENT: development
      Release:
        HONEY_ENVIRONMENT: production
    info:
      path: HOneyNative/Info.plist
      properties:
        HOneyEnvironment: $(HONEY_ENVIRONMENT)
        HOneyBaseURL: $(HONEY_BASE_URL)
        HOneyPortalBaseURL: $(HONEY_PORTAL_BASE_URL)
        UIAppFonts:
          - SourceSans3VF-Upright.ttf
          - SourceSans3VF-Italic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.gaelisus.honey.native
            CFBundleURLSchemes: [honey]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

  HOneyNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HOneyNativeTests
    dependencies:
      - target: HOneyNative
      - package: HOneyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelisus.honey.native.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  HOneyNative:
    build:
      targets:
        HOneyNative: all
        HOneyNativeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HOneyNativeTests
