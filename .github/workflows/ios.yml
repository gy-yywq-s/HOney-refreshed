name: iOS
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
    # lab/* branches are tested on Gary's Mac, not here (2026-09-04).
    branches-ignore: ["lab/**"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
    branches-ignore: ["lab/**"]
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: xcodebuild (macOS runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
        working-directory: ios
      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')]; print(ids[0])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/HOney.xcodeproj \
            -scheme HOney \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify || \
          xcodebuild test \
            -project ios/HOney.xcodeproj \
            -scheme HOney \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
