name: iOS web port
on:
  push:
    paths:
      - "ios-web-port/**"
      - "packages/shared/fixtures/**"
      - "packages/shared/src/api/**"
      - ".github/workflows/ios-web-port.yml"
  pull_request:
    paths:
      - "ios-web-port/**"
      - "packages/shared/fixtures/**"
      - "packages/shared/src/api/**"
      - ".github/workflows/ios-web-port.yml"
concurrency:
  group: ios-web-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: HOneyCore (Linux) + no-reuse gate
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: No-reuse gate
        run: bash ios-web-port/scripts/check-no-reuse.sh
      - name: No small caps / forced uppercase
        run: bash ios-web-port/scripts/check-text-case.sh
      - name: Contract fixtures are checked in
        run: test "$(ls packages/shared/fixtures/api/*.json | wc -l)" -ge 30
      - name: swift test
        run: swift test --parallel
        working-directory: ios-web-port/HOneyCore
  app:
    name: HOneyNative (macOS runner)
    runs-on: macos-15
    permissions:
      contents: write # the parity snapshots land on the ios-web-port-evidence branch
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
        working-directory: ios-web-port
      - name: Pick an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ids=[x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable') and 'iPhone' in x.get('name','')]; print(ids[0])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"
      - name: Build & test
        env:
          # xcodebuild forwards TEST_RUNNER_* to the test process: the visual
          # fixture tests write their PNGs here (fidelity spec v2 §18).
          TEST_RUNNER_HONEY_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: |
          set -o pipefail
          mkdir -p snapshots
          xcodebuild test \
            -project ios-web-port/HOneyNative.xcodeproj \
            -scheme HOneyNative \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | grep -E "error:|warning: unre|Test Case|Executed|BUILD|TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Upload parity snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-snapshots
          path: snapshots
          if-no-files-found: ignore
      # The repo is public: the evidence branch makes every PNG readable at
      # raw.githubusercontent.com without a token. Force-pushed, one commit,
      # never merged.
      - name: Publish snapshots to the evidence branch
        if: always() && github.ref == 'refs/heads/ios-web-port'
        run: |
          if ls snapshots/*.png >/dev/null 2>&1; then
            rm -rf evidence && mkdir evidence && cp snapshots/*.png evidence/
            cd evidence
            git init -q && git checkout -q -b ios-web-port-evidence
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            { echo "# Native parity snapshots"; echo; echo "Rendered from \`ios-web-port@${GITHUB_SHA}\` by VisualFixtureTests (390 × 844 @2x)."; echo; for f in *.png; do echo "- ${f%.png}"; done; } > README.md
            git add -A && git commit -q -m "snapshots for ${GITHUB_SHA}"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ios-web-port-evidence || echo "evidence push refused"
          else
            echo "no snapshots to publish"
          fi
      # The repo is public but job logs need a token to download; a check run's
      # output is readable by anyone, so the compiler's own words land there.
      - name: Publish compile/test errors as a check run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          log = open('xcodebuild.log', encoding='utf-8', errors='replace').read() if os.path.exists('xcodebuild.log') else ''
          keep = re.compile(r'error:|Fatal error|failed \(|XCTAssert|\*\* (BUILD|TEST)')
          seen = []
          for line in log.splitlines():
              if keep.search(line) and line not in seen:
                  seen.append(line)
          warnings = sorted({l for l in log.splitlines() if 'warning:' in l and '/ios-web-port/' in l})
          text = '\n'.join(seen)[:50000] or 'no error lines matched'
          if warnings:
              text += '\n\n# warnings (' + str(len(warnings)) + ')\n' + '\n'.join(warnings)[:10000]
          ok = '** TEST SUCCEEDED **' in log
          body = {
              "name": "xcodebuild errors",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "success" if ok else "neutral",
              "output": {"title": "xcodebuild " + ("succeeded" if ok else "errors"), "summary": f"{len(seen)} matching lines, {len(warnings)} warnings in ios-web-port", "text": "```\n" + text + "\n```"},
          }
          open('check.json', 'w').write(json.dumps(body))
          EOF
          gh api "repos/${{ github.repository }}/check-runs" --input check.json > /dev/null || echo "check run not posted"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
